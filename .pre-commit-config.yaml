repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-json
        files: '\.json$'
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci", "-sr", "-w"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        files: >-
          (^smoke\.sh$)|(^smoke-[^/]+$)|(^_test/.*\.(sh|bash|bats)$)

  - repo: local
    hooks:
      - id: beads-flush
        name: "beads: flush issues DB to JSONL"
        entry: bash -c 'command -v bd >/dev/null 2>&1 || exit 0; command -v dolt >/dev/null 2>&1 || exit 0; bd export -o .beads/issues.jsonl >/dev/null 2>&1 || exit 0'
        language: system
        pass_filenames: false

      - id: gofmt
        name: gofmt
        entry: bash -c 'command -v gofmt >/dev/null 2>&1 || exit 0; gofmt -w "$@"' --
        language: system
        types: [go]
