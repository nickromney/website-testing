# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: smoke

before:
  hooks:
    - go test ./...

builds:
  - id: smoke
    main: ./cmd/smoke-go
    binary: smoke
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X main.Version={{ .Version }}
        -X main.BuildTime={{ .Date }}
        -X main.GitCommit={{ .Commit }}

archives:
  - id: smoke-archive
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github-native
  sort: asc

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
