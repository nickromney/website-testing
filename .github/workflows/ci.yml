name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Install bats
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: Run tests
        run: bats -r _test

      - name: Go tests
        run: go test ./...

  go-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Run tests (race)
        run: go test -race ./...

      - name: Run tests (coverage)
        run: go test -coverprofile=coverage.out ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Cross-compile smoke-go
        env:
          CGO_ENABLED: 0
        run: |
          GOOS=windows GOARCH=amd64 go build ./cmd/smoke-go
          GOOS=darwin GOARCH=arm64 go build ./cmd/smoke-go

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
